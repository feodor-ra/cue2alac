minimum_pre_commit_version: "3.0.0"
default_stages: [pre-commit]

repos:
  # Ruff: lint + autofix
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: ruff (check)
      - id: ruff-format
        name: ruff (format)
  # mypy: run from the project's environment via uv
  - repo: local
    hooks:
      - id: mypy
        name: mypy (uv run)
        entry: uv run --group=lint mypy
        language: system
        types: [python]
        args: ["."]
        pass_filenames: false
  # uv: ensure uv.lock is up-to-date
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.18
    hooks:
      - id: uv-lock
        name: uv lock
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
