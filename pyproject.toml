[project]
name = "cue2alac"
version = "0.1.0"
description = "Convert single FLAC + CUE sheet into individual ALAC tracks with metadata and cover art"
readme = "README.md"
authors = [
    { name = "Рачев Федор", email = "feodor.ra@me.com" },
]
requires-python = ">=3.14.0, <3.15"
dependencies = [
    "typer[standard]~=0.21.1",
]

[project.scripts]
cue2alac = "cue2alac.cue2alac:app"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    { include-group = "lint" },
]

lint = [
    "mypy~=1.19.1",
    "pre-commit~=4.5.1",
    "ruff~=0.14.14",
]

[tool.ruff]
target-version = "py314"
preview = true
respect-gitignore = true
line-length = 89

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D212",
    "RUF001",
    "RUF002",
    "RUF003",
    "S404",
    "S603",
]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"


[tool.mypy]
python_version = "3.14"
plugins = []
pretty = true
show_column_numbers = true
show_error_codes = true
warn_unused_configs = true
strict = true
exclude_gitignore = true
